[package]
name = "miau-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A DAW-grade audio/MIDI engine in Rust: time, events, arrangement, routing, CLAP hosting, PipeWire I/O and persistence."
repository = "https://github.com/BadgerSoft-NL/miau-core"
readme = "README.md"
keywords = ["audio", "midi", "daw", "clap", "pipewire"]
categories = ["multimedia::audio"]

[dependencies]
# persist/ (phase 6): serde is the document model, serde_json the manifest, zip the container
# and blake3 the sample content hash — all four named in design-log note 10.
blake3 = "1"
clack-extensions = { version = "0.1.0", features = ["audio-ports", "clack-host", "note-ports", "params", "state"] }
clack-host = "0.1.0"
# io/smf: the chunk-and-delta-time layer of a standard MIDI file. Only the file *structure* is
# borrowed — the byte↔`Event` mapping stays in `io/midi.rs`, where invariant 6 already put it, so
# one place and only one decides what a status byte means. Chosen over hand-rolling because
# running status, variable-length quantities and the format 0/1/2 split are exactly the kind of
# fiddly, fully-specified work a dependency should carry.
# `parallel` (its rayon-backed multi-track parse) is off: a thread pool is not something an audio
# engine should acquire behind its caller's back, and a MIDI file is parsed once, off the audio
# thread, where the milliseconds do not matter.
midly = { version = "0.5", default-features = false, features = ["std"] }
# `v0_3_49` is a feature on an existing dependency, not a new one: it exposes
# `Buffer::requested()`, which is how a MIDI-only output stream learns its block length — there
# is no sample buffer to measure. PipeWire 0.3.49 is from 2022, so this raises no real floor.
pipewire = { version = "0.10.0", features = ["v0_3_49"] }
rtrb = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only DEFLATE is needed; the container is a plain ZIP, no other codecs to carry.
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# Realtime-safety leans on being explicit; keep the whole clippy bar high from day one.
all = { level = "warn", priority = -1 }
